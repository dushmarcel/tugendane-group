name: Build Tugendane Android (APK & Play Store AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK & Licenses
        run: |
          chmod +x android/gradlew
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK (Direct Phone Installation)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Android App Bundle (Google Play Store AAB)
        run: |
          cd android
          ./gradlew bundleDebug --no-daemon --stacktrace

      - name: Upload Direct Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Tugendane-Rides-Direct-Install-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Google Play Store Bundle (.AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Tugendane-Rides-GooglePlay-AAB
          path: android/app/build/outputs/bundle/debug/app-debug.aab
